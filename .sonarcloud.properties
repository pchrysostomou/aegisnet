# SonarCloud automatic analysis (no scanner runs in CI; the GitHub App analyses each push).
# Tests are declared as tests so main-code ratings reflect main code; the lockfiles, the
# committed corpus and vendored directories are not source.
#
# The frontend's tests sit *beside* the code they test, so `sonar.tests` cannot reach them
# without overlapping `sonar.sources`, and automatic analysis does not honour
# `sonar.test.inclusions` — declaring them here was tried and the gate stayed red. They are
# therefore analysed as source, and the one place that costs something is annotated at the
# line rather than hidden by an exclusion (see `frontend/src/lib/api/client.test.ts`).
sonar.sources=backend/src,frontend/src,infra,tools,backend/Dockerfile,frontend/Dockerfile,docker-compose.yml,docker-compose.test.yml
sonar.tests=backend/tests
# ---------------------------------------------------------------- the open finding
#
# SonarCloud fails this project on **C Security Rating on New Code**, and has since c38e94c.
#
# **Located.** Ten bisection rounds, each excluding one candidate through `sonar.exclusions`
# — the only one of these properties automatic analysis honours; `sonar.tests`,
# `sonar.test.inclusions` and `sonar.test.exclusions` were each tried and did nothing, which
# cost a round that appeared to rule out `backend/tests` and had ruled out nothing. Cleared in
# order and each still red: `.github/**`, two frontend files, `backend/src/**`,
# `backend/tests/**`, `tools/**`, `lib/api/client.ts`, `infra/**`, all of `frontend/src/**`.
# Round ten excluded `backend/Dockerfile` and the gate turned **green**. A diagnostic pull
# request (#19, closed unmerged) then carried a byte-for-byte copy of that file as its only new
# code and reproduced the C, so it is a rule about the file's *content*, not an artefact of that
# path's history.
#
# **Not identified.** Three independent tools call the file clean: `sonarqube:community` — which
# does analyse it, the `iac` plugin is installed and reports zero issues in it — plus
# `trivy config` and `hadolint`. So it is a rule SonarCloud has and they do not.
#
# **A wrong answer was published here before it was checked.** This block used to say the finding
# was `ARG GIT_SHA` plus `ENV GIT_SHA=${GIT_SHA}`. That pair was present at 803d31f, where the
# gate *passed*, and removing it left the gate red. It was the first plausible thing in the file
# and it was written up as the cause. Removed anyway, on its own merits — a build argument
# persisted into image metadata is readable through `docker history`, and Chunk 32 had already
# taken out its twin (E-96) — but it was never the answer.
#
# **The trigger was a comment.** c38e94c changed nothing else in that file, and the gate went
# green to red, so a pre-existing issue entered the new-code window because the file was touched.
# Worth knowing while reading that: this organisation's new-code period is `previous_version` and
# `sonar.projectVersion` is set nowhere, so there is no previous version to be new against.
#
# **No exclusion is left in place.** A green rating bought by carving a file out of the analysis
# is the trade ADR-037 refused for the container image scan, and it is not a better trade here.
# The gate stays red and visible until the finding can be *read*, which needs the SonarCloud
# project made public (Administration → Visibility; a setting of its own, unrelated to this
# repository's visibility, which has been public since the day it was created). Tracked as E-100.
#
# **The method's lesson, learned expensively.** The local scan rated the project **B** while
# SonarCloud rated it **C**. Sonar maps B to minor and C to major, so the two were never looking
# at the same finding — that mismatch was visible from round one and took nine rounds to notice.
# Compare the ratings before trusting a local scan's silence.
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.ndjson
sonar.python.version=3.12
