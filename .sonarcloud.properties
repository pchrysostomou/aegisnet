# SonarCloud automatic analysis (no scanner runs in CI; the GitHub App analyses each push).
# Tests are declared as tests so main-code ratings reflect main code; the lockfiles, the
# committed corpus and vendored directories are not source.
sonar.sources=backend/src,frontend/src,infra,tools,backend/Dockerfile,frontend/Dockerfile,docker-compose.yml,docker-compose.test.yml
sonar.tests=backend/tests
# Bisection round two: the Security Rating on New Code went to C on push c38e94c. Round one
# excluded `.github/**` and the gate still failed, so automatic analysis is not reading the
# workflows and the new `security-events: write` permission is not the finding. Everything else
# that push changed inside sonar.sources is a comment, except `backend/tests/security/
# test_image_scan.py`, which is the only new executable code. Excluding it settles that.
# Restore both lines to their previous values once the answer is known.
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.ndjson
sonar.test.exclusions=backend/tests/security/test_image_scan.py
sonar.python.version=3.12
