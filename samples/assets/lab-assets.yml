# Asset inventory for the imaginary lab that tools/gen_synthetic_eve.py describes.
# `make seed` (python -m aegisnet.cli seed-assets lab-assets) upserts these by hostname.
# Every address is RFC 1918; every name is under example.test. Nothing here is real.
assets:
  - hostname: gw.lab.example.test
    environment: lab
    owner: platform-team
    criticality: 4
    tags: [gateway, infra]
    description: Lab default gateway
    networks:
      - {cidr: 10.10.0.1/32, is_primary: true}
