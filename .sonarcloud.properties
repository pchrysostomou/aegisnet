# SonarCloud automatic analysis (no scanner runs in CI; the GitHub App analyses each push).
# Tests are declared as tests so main-code ratings reflect main code; the lockfiles, the
# committed corpus and vendored directories are not source.
#
# The frontend's tests sit *beside* the code they test, so `sonar.tests` cannot reach them
# without overlapping `sonar.sources`, and automatic analysis does not honour
# `sonar.test.inclusions` — declaring them here was tried and the gate stayed red. They are
# therefore analysed as source, and the one place that costs something is annotated at the
# line rather than hidden by an exclusion (see `frontend/src/lib/api/client.test.ts`).
sonar.sources=backend/src,frontend/src,infra,tools,backend/Dockerfile,frontend/Dockerfile,docker-compose.yml,docker-compose.test.yml
sonar.tests=backend/tests
# Five bisection rounds, all through `sonar.exclusions` (the only one automatic analysis
# honours), each excluded a different candidate and each stayed red: `.github/**`, the two
# frontend files the push touched, all of `backend/src/**`, and all of `backend/tests/**`.
# A finding that survives every one of those is in code that push never changed, which means
# it is pre-existing and entered the new-code window on SonarCloud's side rather than being
# introduced here. The scope is whole and stays whole; the finding is tracked in `docs/STATUS.md`
# and cannot be read while the *SonarCloud project* is private (a setting of its own).
# Seven bisection rounds, every one through `sonar.exclusions` (the only property automatic
# analysis honours — `sonar.tests`, `sonar.test.inclusions` and `sonar.test.exclusions` were
# each tried and each did nothing). `.github/**`, `safe-markdown.tsx`, `schemas.ts`, all of
# `backend/src/**`, all of `backend/tests/**`, all of `tools/**` and `lib/api/client.ts` were
# excluded one at a time and the gate stayed C every time. A finding that survives all seven is
# not in the push that first turned the gate red.
#
# The scope is therefore whole, and stays whole. Leaving any of those exclusions in place would
# buy a green rating by not looking — the trade ADR-037 refused for the container image scan,
# and it is not a better trade here. The finding is open and recorded in `docs/STATUS.md`; it
# cannot be read while the *SonarCloud project* is private, which is a setting of its own and
# unrelated to this repository's visibility.
#
# One thing a local `sonarqube:community` scan did settle: it has no taint analysis at all, so
# it can never reproduce this class of finding. It is still worth running — it named five real
# `typescript:S5332` vulnerabilities in `client.test.ts` — but 'it did not reproduce locally' is
# not evidence. Compare the *ratings* instead: local B against SonarCloud's C means the two are
# not looking at the same finding.
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.ndjson
sonar.python.version=3.12
