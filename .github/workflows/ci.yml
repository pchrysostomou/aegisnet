# Continuous integration.
#
# Every job is hermetic with respect to secrets: the only .env ever created is produced by
# infra/scripts/bootstrap_env.py inside the runner, holds random throwaway values, and is
# discarded with the runner. No repository or organisation secret is read anywhere here.
#
# Every action runs on the Node 24 runtime: GitHub removes Node 20 from hosted runners on
# 2026-09-16, and the earlier majors would stop executing on that date. Actions are pinned
# by major tag where the publisher still moves one; astral-sh/setup-uv stopped publishing
# major tags at v8 and is pinned to an exact release tag instead. Pinning by commit digest
# is tracked with decision F-5 alongside the container base images.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  backend:
    name: backend · ruff, mypy, pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the locked dependency set
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check --config pyproject.toml --output-format=github src tests ../tools ../infra/lab

      - name: Ruff (format)
        run: uv run ruff format --check --config pyproject.toml src tests ../tools ../infra/lab

      - name: Import contracts (domain purity, layering)
        run: uv run lint-imports

      - name: mypy
        run: uv run mypy

      - name: pytest with coverage gate
        env:
          ENV: test
        run: >-
          uv run pytest
          --cov=aegisnet --cov-report=term-missing --cov-report=xml
          --cov-fail-under=85
          --junitxml=pytest-report.xml

      - name: Upload test artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/coverage.xml
            backend/pytest-report.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: frontend · tsc, next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable the pnpm version pinned in package.json
        run: corepack enable

      - name: Install the locked dependency set
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

  manifests:
    name: manifests · compose config, hadolint, ignore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate a throwaway .env
        run: python3 infra/scripts/bootstrap_env.py

      - name: Validate the Compose manifests
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.test.yml config --quiet
          # The opt-in lab (ADR-021). Parsed, never started: CI has no reason to capture packets.
          docker compose -f infra/lab/docker-compose.lab.yml --profile lab config --quiet

      - name: Prove the ignore rules hold
        run: make verify-ignore

      - name: hadolint backend/Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          config: .hadolint.yaml

      - name: hadolint frontend/Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          config: .hadolint.yaml

  migrations:
    # The database suite from docker-compose.test.yml (profile db): the baseline revision
    # upgrades, the ORM matches the migrated schema, the runtime role holds exactly the
    # documented privileges (T-5.3), and downgrade leaves nothing behind. The only .env is
    # the throwaway one generated on the runner.
    name: migrations · upgrade, grants, downgrade on PostgreSQL 16
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate a throwaway .env
        run: python3 infra/scripts/bootstrap_env.py

      - name: Run the database suite against an ephemeral PostgreSQL
        run: docker compose -f docker-compose.test.yml --profile db run --rm --build tests-db

      - name: Show database logs
        if: failure()
        run: docker compose -f docker-compose.test.yml --profile db logs --no-color --tail=100 db-test

      - name: Tear down, including the anonymous data volume
        if: always()
        run: docker compose -f docker-compose.test.yml --profile db down --volumes --remove-orphans

  stack:
    # The Milestone 1 gate as stated in ADR-011: `make bootstrap && docker compose up
    # --build` reaches healthy from a clean clone, then `make migrate` brings the schema
    # to head. Every service has a healthcheck, so `--wait` only returns once all six
    # report healthy.
    name: stack · compose up --build reaches healthy, migrate
    runs-on: ubuntu-latest
    needs: [backend, frontend, manifests, migrations]
    steps:
      - uses: actions/checkout@v6

      - name: Generate a throwaway .env
        run: python3 infra/scripts/bootstrap_env.py

      - name: Build and start every service
        env:
          GIT_SHA: ${{ github.sha }}
        run: docker compose up --build --detach --wait --wait-timeout 240

      - name: Apply the migrations as the migrator role
        run: |
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api alembic current

      - name: Create an admin user and an ingest service token through the CLI
        run: |
          set -euo pipefail
          password=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')
          echo "::add-mask::$password"
          printf '%s\n' "$password" | docker compose run --rm -T api \
            python -m aegisnet.cli create-user ci-admin@example.test --role admin --password-stdin \
            | tail -n 1
          token=$(docker compose run --rm -T api \
            python -m aegisnet.cli create-service-token ci-sensor --ttl-days 1 \
            | tail -n 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$token"
          echo "CI_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "INGEST_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Probe the published endpoints from the runner
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8000/healthz
          curl --fail --silent --show-error http://127.0.0.1:8000/readyz
          # Deny by default: without a credential the version route answers 401.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8000/api/v1/meta/version)
          test "$code" = "401"
          version=$(curl --fail --silent --show-error -H "X-Ingest-Token: $INGEST_TOKEN" \
            http://127.0.0.1:8000/api/v1/meta/version)
          echo "$version"
          echo "$version" | grep -q '"schema_revision":"0003_detection_tables"'
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health

      - name: Ingest the synthetic corpus over HTTP and watch the worker finish it
        run: |
          set -euo pipefail
          accepted=$(curl --fail --silent --show-error -H "X-Ingest-Token: $INGEST_TOKEN" \
            -H 'content-type: application/x-ndjson' \
            --data-binary @samples/synthetic/benign-baseline-01.ndjson \
            'http://127.0.0.1:8000/api/v1/ingest/eve?source_label=ci-sensor&mode=async')
          echo "$accepted"
          poll=$(echo "$accepted" | python3 -c 'import json, sys; print(json.load(sys.stdin)["poll_url"])')
          access=$(curl --fail --silent --show-error -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d "{\"email\":\"ci-admin@example.test\",\"password\":\"$CI_PASSWORD\"}" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          echo "::add-mask::$access"
          batch=""
          for _ in $(seq 1 30); do
            batch=$(curl --fail --silent --show-error -H "Authorization: Bearer $access" \
              "http://127.0.0.1:8000$poll")
            case "$batch" in *'"status":"complete"'*) break ;; esac
            sleep 2
          done
          echo "$batch"
          echo "$batch" | grep -q '"status":"complete"'
          echo "$batch" | grep -q '"stored":2000'
          curl --fail --silent --show-error -H "Authorization: Bearer $access" \
            'http://127.0.0.1:8000/api/v1/audit?limit=5' | grep -q '"ingest.batch_created"'
          echo "ACCESS=$access" >> "$GITHUB_ENV"

      - name: The completed batch queued its own sweep (ADR-020) and the scheduler registered both periodic actors
        run: |
          set -euo pipefail
          runs=""
          for _ in $(seq 1 30); do
            runs=$(curl --fail --silent --show-error -H "Authorization: Bearer $ACCESS" \
              'http://127.0.0.1:8000/api/v1/detections/runs?limit=10')
            case "$runs" in *'"rule_id":"D-005"'*) break ;; esac
            sleep 2
          done
          echo "$runs"
          echo "$runs" | grep -q '"rule_id":"D-005"'
          # Into files first: with pipefail, `docker compose logs | grep -q` fails with 255
          # when grep closes the pipe early and the writer sees EPIPE.
          docker compose logs --no-color worker > worker.log
          docker compose logs --no-color scheduler > scheduler.log
          grep -q 'post_ingest_sweep_queued' worker.log
          grep -q 'scheduled_sweep@detection' scheduler.log
          grep -q 'nightly_baselines@detection' scheduler.log

      - name: Queue a detection sweep over HTTP and watch the worker record every rule
        run: |
          set -euo pipefail
          accepted=$(curl --fail --silent --show-error -X POST -H "Authorization: Bearer $ACCESS" \
            -H 'content-type: application/json' \
            -d '{"from":"2026-09-01T00:00:00Z","to":"2026-09-01T02:00:00Z"}' \
            http://127.0.0.1:8000/api/v1/detections/sweeps)
          echo "$accepted"
          runs=""
          for _ in $(seq 1 30); do
            runs=$(curl --fail --silent --show-error -H "Authorization: Bearer $ACCESS" \
              'http://127.0.0.1:8000/api/v1/detections/runs?limit=10')
            case "$runs" in *'"rule_id":"D-001"'*) break ;; esac
            sleep 2
          done
          echo "$runs"
          echo "$runs" | grep -q '"rule_id":"D-001"'
          echo "$runs" | grep -q '"status":"success"'
          curl --fail --silent --show-error -H "Authorization: Bearer $ACCESS" \
            'http://127.0.0.1:8000/api/v1/alerts?limit=5' | grep -q '"items"'
          curl --fail --silent --show-error -H "Authorization: Bearer $ACCESS" \
            'http://127.0.0.1:8000/api/v1/detections/rules' | grep -q '"D-001"'

      - name: Show service state and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=100

      - name: Tear down, including the database volume
        if: always()
        run: docker compose down --volumes --remove-orphans
