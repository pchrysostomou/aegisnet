# SonarCloud automatic analysis (no scanner runs in CI; the GitHub App analyses each push).
# Tests are declared as tests so main-code ratings reflect main code; the lockfiles, the
# committed corpus and vendored directories are not source.
sonar.sources=backend/src,frontend/src,infra,tools,backend/Dockerfile,frontend/Dockerfile,docker-compose.yml,docker-compose.test.yml
sonar.tests=backend/tests
# Bisection round: the Security Rating on New Code went to C on push c38e94c. Everything that
# push changed inside sonar.sources is a comment except one test file, and the only change with
# any security semantics at all is the `security-events: write` permission added to the images
# job. `.github` is not in sonar.sources, so if excluding it moves the gate, automatic analysis
# is reading workflows regardless of that setting — which is the thing worth knowing.
# Restore this line to its previous value once the answer is known.
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.ndjson,.github/**
sonar.python.version=3.12
