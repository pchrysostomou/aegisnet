# SonarCloud automatic analysis (no scanner runs in CI; the GitHub App analyses each push).
# Tests are declared as tests so main-code ratings reflect main code; the lockfiles, the
# committed corpus and vendored directories are not source.
#
# The frontend's tests sit *beside* the code they test, so `sonar.tests` cannot reach them
# without overlapping `sonar.sources`, and automatic analysis does not honour
# `sonar.test.inclusions` — declaring them here was tried and the gate stayed red. They are
# therefore analysed as source, and the one place that costs something is annotated at the
# line rather than hidden by an exclusion (see `frontend/src/lib/api/client.test.ts`).
sonar.sources=backend/src,frontend/src,infra,tools,backend/Dockerfile,frontend/Dockerfile,docker-compose.yml,docker-compose.test.yml
sonar.tests=backend/tests
# ---------------------------------------------------------------- the finding, closed
#
# For a day this project failed on **C Security Rating on New Code**. It was `docker:S8541`
# twice: `uv sync` without `--no-build` on both calls in `backend/Dockerfile`. Installing a
# source distribution runs its build backend — arbitrary Python at image-build time — and
# `--frozen` pins *what* is installed while saying nothing about *what runs while installing it*.
# Fixed there and everywhere else the same hole existed. The gate passes; security and
# reliability are both A; there are zero open vulnerabilities. The record is E-100.
#
# Three things worth keeping, because each cost real time:
#
# 1. **Only `sonar.exclusions` is honoured by automatic analysis.** `sonar.tests`,
#    `sonar.test.inclusions` and `sonar.test.exclusions` were each tried and each did nothing —
#    one of them silently wasted a bisection round that appeared to rule out `backend/tests`.
#
# 2. **Compare the ratings before trusting a local scan's silence.** `sonarqube:community` rated
#    the project **B** while SonarCloud rated it **C**. Sonar maps B to minor and C to major, so
#    the two were never looking at the same finding, and that was visible from the first round.
#    Community also runs a narrower Docker rule set, so this finding could not appear locally.
#
# 3. **The project is public on sonarcloud.io now, so read the finding instead of bisecting:**
#    `curl -s "https://sonarcloud.io/api/issues/search?componentKeys=pchrysostomou_aegisnet\
#    &branch=main&types=VULNERABILITY&resolved=false"`. The `resolved=false` is not optional —
#    without it the count includes closed issues, which is how 54 got reported where there were 2.
#
# No file is excluded to make any of this pass. A green rating bought by carving a file out of
# the analysis is the trade ADR-037 refused for the container image scan.
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.ndjson
sonar.python.version=3.12
