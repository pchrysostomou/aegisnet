# SonarCloud automatic analysis (no scanner runs in CI; the GitHub App analyses each push).
# Tests are declared as tests so main-code ratings reflect main code; the lockfiles, the
# committed corpus and vendored directories are not source.
sonar.sources=backend/src,frontend/src,infra,tools,backend/Dockerfile,frontend/Dockerfile,docker-compose.yml,docker-compose.test.yml
sonar.tests=backend/tests,frontend/src,frontend/e2e
# The frontend's tests sit beside the code they test, so they have to be *named* as tests or
# Sonar rates them as product source. That asymmetry — `backend/tests` declared, the frontend's
# co-located tests not — is what put a C Security Rating on New Code: five `typescript:S5332`
# ("using http protocol is insecure") in `frontend/src/lib/api/client.test.ts`, which asserts
# that the API base URL defaults to `http://localhost:8000` and that `http://user:pass@api:8000`
# is refused. Those URLs are the assertions; rewriting them to https would delete the test.
#
# Found by scanning locally rather than by bisecting: four bisection rounds excluded the wrong
# things because the file is a *test* nobody thought to look at. `sonarqube:community` on
# loopback named the rule and the five lines in one pass.
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.ndjson
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/e2e/**
sonar.python.version=3.12
