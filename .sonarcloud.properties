# SonarCloud automatic analysis (no scanner runs in CI; the GitHub App analyses each push).
# Tests are declared as tests so main-code ratings reflect main code; the lockfiles, the
# committed corpus and vendored directories are not source.
#
# The frontend's tests sit *beside* the code they test, so `sonar.tests` cannot reach them
# without overlapping `sonar.sources`, and automatic analysis does not honour
# `sonar.test.inclusions` — declaring them here was tried and the gate stayed red. They are
# therefore analysed as source, and the one place that costs something is annotated at the
# line rather than hidden by an exclusion (see `frontend/src/lib/api/client.test.ts`).
# TEMPORARY, on this branch only. `backend/Dockerfile.probe` is a byte-for-byte copy of
# `backend/Dockerfile`. Ten bisection rounds proved the failing Security finding lives in that
# file, and nothing available locally can see it. A pull request is analysed against its own
# diff, so every line of a *new* file is new code — which makes SonarCloud report the finding
# with its rule and line in the PR decoration. This branch is a diagnostic and is never merged.
sonar.sources=backend/src,frontend/src,infra,tools,backend/Dockerfile,backend/Dockerfile.probe,frontend/Dockerfile,docker-compose.yml,docker-compose.test.yml
sonar.tests=backend/tests
# Five bisection rounds, all through `sonar.exclusions` (the only one automatic analysis
# honours), each excluded a different candidate and each stayed red: `.github/**`, the two
# frontend files the push touched, all of `backend/src/**`, and all of `backend/tests/**`.
# A finding that survives every one of those is in code that push never changed, which means
# it is pre-existing and entered the new-code window on SonarCloud's side rather than being
# introduced here. The scope is whole and stays whole; the finding is tracked in `docs/STATUS.md`
# and cannot be read while the *SonarCloud project* is private (a setting of its own).
# Ten bisection rounds located it, and the tenth is the one that matters: excluding
# `backend/Dockerfile` turned the gate green. Every other region in scope had been cleared
# first — `.github/**`, three frontend files, `backend/src/**`, `backend/tests/**`, `tools/**`,
# `infra/**` and all of `frontend/src/**` — each through `sonar.exclusions`, each still red.
#
# The finding was `ARG GIT_SHA` plus `ENV GIT_SHA=${GIT_SHA}`: a build-time value baked into
# image metadata, where `docker history` can read it. It is the same shape as Chunk 32's
# `LABEL org.opencontainers.image.revision="${GIT_SHA}"` (E-96) — that fix removed one instance
# and left the other. `GIT_SHA` is a runtime environment variable from Compose now, so
# `/api/v1/meta/version` is unchanged and nothing is baked in.
#
# It also explains why a local `sonarqube:community` scan never reproduced any of this: it
# reported five MINOR `typescript:S5332` and rated the project B, while SonarCloud rated it C.
# B against C was the tell that the two were not looking at the same finding, and it took far
# too long to notice.
#
# The exclusion is gone: the fix is verified with the file back in scope, which is the only
# verification worth having.
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.ndjson
sonar.python.version=3.12
