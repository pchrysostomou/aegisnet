# Security scanning (THREAT_MODEL T-5.4 secret scanning, T-5.6 vulnerable dependencies).
#
# Runs on every push and pull request and once a week, so a newly published advisory
# against an unchanged lockfile is still surfaced.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks · no secret in history or diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  python-deps:
    name: pip-audit · backend lockfile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # No cache here. This job only exports the lockfile and runs pip-audit through
          # uvx. Sharing the ci backend job's cache key meant this faster job saved a cache
          # holding only pip-audit's dependencies, and the backend job could never save
          # its own ("Unable to reserve cache ... another job may be creating this cache").
          enable-cache: false
      - name: Export the locked runtime dependency set
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.lock.txt
      - name: pip-audit
        run: uvx pip-audit --strict --requirement requirements.lock.txt

  node-deps:
    name: pnpm audit · frontend lockfile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production dependencies, high and above)
        run: pnpm audit --prod --audit-level=high
