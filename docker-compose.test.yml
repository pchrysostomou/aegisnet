# Local test, lint, and typecheck runner.
#
# `tests` is the hermetic suite: it fakes the PostgreSQL and Redis probes rather than talking
# to real services, and it needs no datastore container.
#
# `db-test` and `tests-db` (profile `db`, decision F-2) run the database suite — migrations,
# grants, schema/ORM agreement — against an ephemeral PostgreSQL 16 that uses the same image,
# service user, init scripts and hardening as the real `db`. Its data lives in an anonymous
# volume that `down --volumes` removes; it publishes no port. Credentials come from `.env`
# exactly as they do for the real stack, so `make bootstrap` is the prerequisite and no
# credential literal appears here. `make test-db` wraps the run and the teardown.
#
# The whole repository is mounted at /repo because the security tests read the committed
# Compose file, both Dockerfiles, .env.example, and .gitignore as data. Caches are redirected
# to /tmp so the mounted tree is not polluted.
#
# No secret variables are set here at all. ENV=test is the only environment in which the
# settings object tolerates the `__REPLACE_ME__` placeholder defaults, so the suite needs no
# credential values, and this file therefore contains no credential literal to leak, rot, or
# be copied into a real environment by mistake.

name: aegisnet-test

services:
  tests:
    build:
      context: ./backend
      target: dev
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      ENV: test
      DEBUG: "false"
      LOG_LEVEL: WARNING
      PYTHONPATH: /repo/backend/src
      PYTHONDONTWRITEBYTECODE: "1"
      COVERAGE_FILE: /tmp/.coverage
      MYPY_CACHE_DIR: /tmp/mypy_cache
      RUFF_CACHE_DIR: /tmp/ruff_cache
      PYTEST_ADDOPTS: -p no:cacheprovider
      # Hostnames are deliberately unresolvable: nothing in Chunk 1 may open a connection.
      POSTGRES_HOST: db-unused
      POSTGRES_PORT: "5432"
      POSTGRES_DB: aegisnet
      POSTGRES_APP_USER: aegisnet_app
      POSTGRES_MIGRATOR_USER: aegisnet_migrator
      REDIS_HOST: redis-unused
      REDIS_PORT: "6379"
    volumes:
      # Read-write so `make format` can rewrite files; everything else only reads.
      - .:/repo
    working_dir: /repo/backend
    command: ["pytest"]

  db-test:
    image: postgres:16-alpine
    profiles: ["db"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # Same as the real db: started directly as the service user, no privilege switch.
    user: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AEGISNET_APP_USER: ${POSTGRES_APP_USER}
      AEGISNET_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      AEGISNET_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER}
      AEGISNET_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD}
      AEGISNET_RETENTION_USER: ${POSTGRES_RETENTION_USER}
      AEGISNET_RETENTION_PASSWORD: ${POSTGRES_RETENTION_PASSWORD}
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  tests-db:
    build:
      context: ./backend
      target: dev
    profiles: ["db"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # The migrator and app credentials, so the suite can act as either role.
    env_file: [.env]
    environment:
      ENV: test
      DEBUG: "false"
      LOG_LEVEL: WARNING
      AEGISNET_DB_TESTS: "1"
      PYTHONPATH: /repo/backend/src
      PYTHONDONTWRITEBYTECODE: "1"
      MYPY_CACHE_DIR: /tmp/mypy_cache
      RUFF_CACHE_DIR: /tmp/ruff_cache
      PYTEST_ADDOPTS: -p no:cacheprovider
      POSTGRES_HOST: db-test
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis-unused
      REDIS_PORT: "6379"
    volumes:
      - .:/repo
    working_dir: /repo/backend
    depends_on:
      db-test: {condition: service_healthy}
    command: ["pytest", "-m", "db"]

  # The load suite (profile `load`, Chunk 26). Unlike `tests` and `tests-db` it does not bring
  # its own datastore: it drives the *running* stack, so it joins that stack's network and
  # spends the same Redis budgets an operator's requests would. Credentials come from the
  # environment, the same two the browser suite uses.
  loadtests:
    build:
      context: ./backend
      target: dev
    profiles: ["load"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    env_file: [.env]
    environment:
      AEGISNET_LOAD_TESTS: "1"
      ENV: test
      DEBUG: "false"
      LOG_LEVEL: WARNING
      PYTHONPATH: /repo/backend/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: -p no:cacheprovider
      MYPY_CACHE_DIR: /tmp/mypy_cache
      RUFF_CACHE_DIR: /tmp/ruff_cache
      AEGISNET_API_PUBLIC_URL: http://api:8000
      POSTGRES_HOST: db
      REDIS_HOST: redis
      AEGISNET_E2E_ANALYST: ${AEGISNET_E2E_ANALYST:-}
      AEGISNET_E2E_ANALYST_PASSWORD: ${AEGISNET_E2E_ANALYST_PASSWORD:-}
    volumes:
      - .:/repo
    working_dir: /repo/backend
    networks: [stack]
    command: ["pytest", "-m", "load"]

networks:
  # The running stack's network, created by `docker-compose.yml`. Declared external so this
  # file never creates it: if the stack is down there is nothing to load-test.
  stack:
    external: true
    name: aegisnet_default
