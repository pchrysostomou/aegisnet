[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aegisnet"
version = "1.0.0"
description = "AegisNet — defensive network threat detection lab (backend)"
# Must be inside this directory: hatchling rejects a path outside the project root, which
# makes the package unbuildable. Project-level documentation is at ../README.md.
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.141,<0.142",
  # Imported directly (api/errors.py, api/v1/ingest.py), so it is declared directly rather
  # than relied on as fastapi's transitive. The floor is the advisory floor below.
  "starlette>=1.3.1",
  "uvicorn[standard]>=0.52,<0.53",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy[asyncio]>=2.0.35,<2.1",
  "asyncpg>=0.29,<0.30",
  "redis>=5.1,<7.0",
  "dramatiq[redis]>=1.17,<2.0",
  "alembic>=1.19,<2.0",
  "pyyaml>=6.0,<7.0",
  "anyio>=4.0,<5.0",
  "argon2-cffi>=23.1,<24.0",
  "pyjwt>=2.9,<3.0",
  "python-multipart>=0.0.12,<0.1",
  "periodiq>=0.13,<1",
  # The outbound boundary (adapters/perplexity). A runtime dependency since Chunk 23, when
  # the API first wired the brief service in — before that httpx was here only for the test
  # client, and the runtime image did not carry it.
  "httpx>=0.27,<0.28",
]

[tool.uv]
# starlette is pulled in by fastapi, whose pin is only a floor. Anything below 1.3.1
# carries known advisories (PYSEC-2026-161/-248/-249/-1941/-1942/-2280/-2281), so the
# resolver is barred from selecting one; security.yml's pip-audit enforces the same.
constraint-dependencies = ["starlette>=1.3.1"]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.3,<2.0",
  "pytest-cov>=5.0,<6.0",
  "httpx>=0.27,<0.28",
  # A real CommonMark parser, so the report tests can assert on the elements a viewer
  # would actually build rather than on substrings the document does not contain.
  "markdown-it-py>=3.0,<5.0",
  "ruff>=0.6.9,<0.7",
  "mypy>=1.11,<2.0",
  "types-pyyaml>=6.0,<7.0",
  "import-linter>=2.0,<3.0",
  "fakeredis>=2.26,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegisnet"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "SIM", "PTH", "RUF", "S", "BLE"]
ignore = [
  "S101",  # assert is expected in tests; narrowed by per-file-ignores below
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.ruff.lint.flake8-bandit]
# Shelling out is forbidden in application code (THREAT_MODEL T-1.2). Ruff's S6xx rules
# cover subprocess use; the ban is additionally documented in SECURITY.md.
check-typed-exception = true

# ---------------------------------------------------------------- import-linter
# ARCHITECTURE §1: domain/ is pure. `uv run lint-imports` enforces it (Makefile lint, CI).
[tool.importlinter]
root_package = "aegisnet"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain imports no infrastructure"
type = "forbidden"
source_modules = ["aegisnet.domain"]
forbidden_modules = [
  "aegisnet.adapters",
  "aegisnet.api",
  "aegisnet.cli",
  "aegisnet.services",
  "aegisnet.workers",
  "aegisnet.config",
  "aegisnet.logging",
  "aegisnet.main",
  "aegisnet.version",
  "alembic",
  "asyncpg",
  "dramatiq",
  "fastapi",
  "httpx",
  "pydantic_settings",
  "redis",
  "sqlalchemy",
  "starlette",
  "yaml",
]

[[tool.importlinter.contracts]]
name = "entrypoints over services over adapters over domain"
type = "layers"
layers = [
  "aegisnet.api | aegisnet.workers | aegisnet.cli",
  "aegisnet.services",
  "aegisnet.adapters",
  "aegisnet.domain",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
plugins = []

# Strict mode is scoped to the pure domain layer, which does not exist until Chunk 3.
# The contract is declared here now so it is enforced the moment that package appears.
# periodiq ships no type information; its two entry points are wrapped in typed code.
[[tool.mypy.overrides]]
module = "periodiq"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aegisnet.domain.*"
strict = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
  "unit: pure, no I/O",
  "integration: exercises the assembled application",
  "security: asserts a THREAT_MODEL mitigation",
  "db: needs the ephemeral PostgreSQL (docker-compose.test.yml --profile db); skipped otherwise",
  "load: drives a running stack under concurrency (make load-test); skipped otherwise",
]

[tool.coverage.run]
source = ["src/aegisnet"]
branch = true
# The migration environment, the SQL stores and the worker actor are exercised by the
# database suite (`make test-db`) against a real PostgreSQL, and the worker entrypoint by the
# stack, rather than under this hermetic gate.
omit = [
  "*/__init__.py",
  "*/adapters/db/migrations/*",
  "*/adapters/db/asset_store.py",
  "*/adapters/db/audit_store.py",
  "*/adapters/db/auth_store.py",
  "*/adapters/db/brief_store.py",
  "*/adapters/db/detection_store.py",
  "*/adapters/db/event_read_store.py",
  "*/adapters/db/incident_store.py",
  "*/adapters/db/ingest_store.py",
  "*/adapters/db/retention_store.py",
  "*/workers/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
