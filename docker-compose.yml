# AegisNet local stack. Chunk 1 of Milestone 1.
#
# Safety notes:
#   * Every published port is bound to 127.0.0.1 — nothing is reachable off-host (THREAT_MODEL T-5.2).
#   * `db` and `redis` publish no ports at all.
#   * All services drop every Linux capability and disable privilege escalation.
#   * Images run as non-root. The project images set USER in their Dockerfiles; the official
#     postgres and redis images instead start as root and drop to their service user with
#     gosu/setpriv, which needs CAP_SETUID/CAP_SETGID and therefore fails under cap_drop ALL
#     ("setresuid failed: Operation not permitted"). They are started directly as that user
#     via `user:` so no privilege switch is ever attempted.
#   * `read_only` root filesystems are deliberately deferred to Milestone 6 (THREAT_MODEL T-5.1, partial).
#   * Image tags are pinned by minor version. Digest pinning is tracked as F-5 and is NOT done yet;
#     run `make pin-digests` to obtain manifest-list digests, then commit them here.

name: aegisnet

x-hardening: &hardening
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    <<: *hardening
    # uid 70 in the alpine image. Owns /var/lib/postgresql/data and /var/run/postgresql, so
    # initdb and the socket directory need no chown and no capability.
    user: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed only by the init script below to create least-privilege roles.
      AEGISNET_APP_USER: ${POSTGRES_APP_USER}
      AEGISNET_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      AEGISNET_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER}
      AEGISNET_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    <<: *hardening
    # uid 999 in the image. Persistence is disabled below, so /data is never written.
    user: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    build:
      context: ./backend
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    <<: *hardening
    command:
      ["uvicorn", "aegisnet.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-server-header"]
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      SAMPLES_DIR: /app/samples
    volumes:
      # Registered datasets only; read-only, and resolution is confined to it (T-1.6).
      - ./samples:/app/samples:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Dramatiq worker. Registers one actor, `import_dataset` (Chunk 4, ADR-014); the
  # scheduler and periodic sweeps stay deferred (ADR-010). Its healthcheck is process-level
  # liveness only and deliberately makes no readiness claim.
  worker:
    build:
      context: ./backend
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    <<: *hardening
    command: ["dramatiq", "aegisnet.workers.main", "--processes", "1", "--threads", "2"]
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      SAMPLES_DIR: /app/samples
    volumes:
      - ./samples:/app/samples:ro
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      # Liveness only: is the worker process alive. NOT a readiness or capability signal.
      # The bracketed first letter keeps the pattern from matching the probe's own shell,
      # whose command line contains the pattern text; without it pgrep always succeeds.
      test: ["CMD-SHELL", "pgrep -f '[d]ramatiq aegisnet.workers.main' > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  web:
    build:
      context: ./frontend
      target: runtime
    <<: *hardening
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-AegisNet}
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  db_data:
