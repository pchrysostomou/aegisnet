[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aegisnet"
version = "0.1.0"
description = "AegisNet — defensive network threat detection lab (backend)"
# Must be inside this directory: hatchling rejects a path outside the project root, which
# makes the package unbuildable. Project-level documentation is at ../README.md.
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.52,<0.53",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy[asyncio]>=2.0.35,<2.1",
  "asyncpg>=0.29,<0.30",
  "redis>=5.1,<6.0",
  "dramatiq[redis]>=1.17,<2.0",
]

[tool.uv]
# starlette is pulled in by fastapi, whose pin is only a floor. Anything below 1.3.1
# carries known advisories (PYSEC-2026-161/-248/-249/-1941/-1942/-2280/-2281), so the
# resolver is barred from selecting one; security.yml's pip-audit enforces the same.
constraint-dependencies = ["starlette>=1.3.1"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<0.25",
  "pytest-cov>=5.0,<6.0",
  "httpx>=0.27,<0.28",
  "ruff>=0.6.9,<0.7",
  "mypy>=1.11,<2.0",
  "pyyaml>=6.0,<7.0",
  "types-pyyaml>=6.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegisnet"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "SIM", "PTH", "RUF", "S", "BLE"]
ignore = [
  "S101",  # assert is expected in tests; narrowed by per-file-ignores below
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.ruff.lint.flake8-bandit]
# Shelling out is forbidden in application code (THREAT_MODEL T-1.2). Ruff's S6xx rules
# cover subprocess use; the ban is additionally documented in SECURITY.md.
check-typed-exception = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
plugins = []

# Strict mode is scoped to the pure domain layer, which does not exist until Chunk 3.
# The contract is declared here now so it is enforced the moment that package appears.
[[tool.mypy.overrides]]
module = "aegisnet.domain.*"
strict = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
  "unit: pure, no I/O",
  "integration: exercises the assembled application",
  "security: asserts a THREAT_MODEL mitigation",
]

[tool.coverage.run]
source = ["src/aegisnet"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
