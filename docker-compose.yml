# AegisNet local stack. Chunk 1 of Milestone 1.
#
# Safety notes:
#   * Every published port is bound to 127.0.0.1 — nothing is reachable off-host (THREAT_MODEL T-5.2).
#   * `db` and `redis` publish no ports at all.
#   * All services drop every Linux capability and disable privilege escalation.
#   * Images run as non-root. The project images set USER in their Dockerfiles; the official
#     postgres and redis images instead start as root and drop to their service user with
#     gosu/setpriv, which needs CAP_SETUID/CAP_SETGID and therefore fails under cap_drop ALL
#     ("setresuid failed: Operation not permitted"). They are started directly as that user
#     via `user:` so no privilege switch is ever attempted.
#   * Every service runs on a `read_only` root filesystem (THREAT_MODEL T-5.1). The writable paths
#     below are not guesses: `docker diff` on a stack that had been up seven hours says db writes
#     only its socket directory, api/worker/scheduler write only dramatiq's Prometheus directory
#     under /tmp, and redis and web write nothing at all.
#   * Image tags are pinned by minor version, and stay that way: Chunk 30 re-examined decision
#     F-5 and kept it, because nothing in this repository bumps a digest (there is no Dependabot
#     configuration at all), so pinning without an updater would freeze the images and stop
#     security patches arriving. The compensating control is the `images` job in
#     .github/workflows/security.yml, which scans what is actually inside every image on every
#     push and weekly. The reasoning and what it does *not* cover are residual risk R-10.
#     `make pin-digests` still prints the digests for anyone who decides otherwise.

name: aegisnet

x-hardening: &hardening
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    <<: *hardening
    tmpfs:
      # The unix socket and its lock file — all `docker diff` found db writing outside
      # its data volume. On alpine /var/run is a symlink to /run, which is the real path.
      - /run/postgresql:size=16m,mode=1777
    # uid 70 in the alpine image. Owns /var/lib/postgresql/data and /var/run/postgresql, so
    # initdb and the socket directory need no chown and no capability.
    user: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed only by the init script below to create least-privilege roles.
      AEGISNET_APP_USER: ${POSTGRES_APP_USER}
      AEGISNET_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      AEGISNET_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER}
      AEGISNET_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD}
      AEGISNET_RETENTION_USER: ${POSTGRES_RETENTION_USER}
      AEGISNET_RETENTION_PASSWORD: ${POSTGRES_RETENTION_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    <<: *hardening
    # uid 999 in the image. Persistence is disabled below, so /data is never written.
    user: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    build:
      context: ./backend
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    <<: *hardening
    tmpfs:
      # dramatiq creates its Prometheus directory at import, and Starlette rolls a
      # multipart part over 1 MiB to disk here. Sized above INGEST_MAX_BODY_BYTES so a
      # legitimate upload cannot be refused by the tmpfs rather than by the cap.
      - /tmp:size=128m,mode=1777
    command:
      ["uvicorn", "aegisnet.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-server-header"]
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      SAMPLES_DIR: /app/samples
      SPOOL_DIR: /app/spool
    volumes:
      # Registered datasets only; read-only, and resolution is confined to it (T-1.6).
      - ./samples:/app/samples:ro
      # Uploads wait here between the request and the worker (T-1.4); shared with the
      # worker and nothing else. Messages carry the spool name only (TB-5).
      - ingest_spool:/app/spool
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Dramatiq worker. Registers four actors — `import_dataset` (Chunk 4, ADR-014),
  # `import_upload` (Chunk 6, ADR-016), `run_detectors` (Chunk 9, ADR-018) and
  # `recompute_baselines` (Chunk 11, ADR-019) — plus the three the scheduler below sends:
  # `scheduled_sweep`, `nightly_baselines` (ADR-020) and `nightly_retention` (ADR-033).
  # The periodic ones are ordinary actors; only their sending is periodic, and this is the
  # process that runs all seven. Its healthcheck is process-level liveness only and
  # deliberately makes no readiness claim.
  worker:
    build:
      context: ./backend
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    <<: *hardening
    tmpfs:
      # Same import, plus one counter file per process under dramatiq-prometheus.
      - /tmp:size=128m,mode=1777
    command: ["dramatiq", "aegisnet.workers.main", "--processes", "1", "--threads", "2"]
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      SAMPLES_DIR: /app/samples
      SPOOL_DIR: /app/spool
    volumes:
      - ./samples:/app/samples:ro
      - ingest_spool:/app/spool
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      # Liveness only: is the worker process alive. NOT a readiness or capability signal.
      # The bracketed first letter keeps the pattern from matching the probe's own shell,
      # whose command line contains the pattern text; without it pgrep always succeeds.
      test: ["CMD-SHELL", "pgrep -f '[d]ramatiq aegisnet.workers.main' > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  scheduler:
    # periodiq: sends the three periodic actors (the ten-minute sweep, the nightly baseline
    # recompute, the nightly retention prune) to the detection queue; the worker runs them
    # (ADR-020, ADR-033). The retention message is sent every night whether or not
    # RETENTION_ENABLED is on — the actor reads the setting, so the scheduler holds no opinion
    # about it. It talks to Redis only, mounts nothing, and if it is down nothing periodic
    # happens.
    build:
      context: ./backend
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    <<: *hardening
    tmpfs:
      # The same dramatiq import and nothing else; it only sends messages.
      - /tmp:size=16m,mode=1777
    command: ["periodiq", "aegisnet.workers.main"]
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      # Liveness only, same shape as the worker's probe.
      test: ["CMD-SHELL", "pgrep -f '[p]eriodiq aegisnet.workers.main' > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  web:
    build:
      context: ./frontend
      target: runtime
      args:
        # Build metadata only, for the image's revision label; the dashboard reads nothing
        # from it. Same source as the api and worker builds so both images name one commit.
        GIT_SHA: ${GIT_SHA:-unknown}
    <<: *hardening
    tmpfs:
      # Insurance, and said plainly: seven hours of running wrote nothing here, because
      # every page is force-dynamic and every fetch is no-store. But Next's file cache
      # writes under this path and the case actions call revalidatePath, so being wrong
      # would be a 500 in the middle of an analyst's workflow rather than a boot failure.
      - /app/.next/cache:size=64m,mode=1777
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-AegisNet}
      PORT: "3000"
      # Server-side only, deliberately not NEXT_PUBLIC_: the browser talks to this container,
      # this container talks to the API, and no token or API address reaches a script (T-2.4).
      AEGISNET_API_URL: ${AEGISNET_API_URL:-http://api:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  db_data:
  ingest_spool:
