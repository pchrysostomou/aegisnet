# Security scanning (THREAT_MODEL T-5.4 secret scanning, T-5.6 vulnerable dependencies).
#
# Runs on every push and pull request and once a week, so a newly published advisory
# against an unchanged lockfile — or an unchanged image tag — is still surfaced.
#
# Three jobs read lockfiles and one reads what is actually inside the images. The lockfile
# audits cannot see a base image at all: a CVE in the distribution's openssl ships in every
# container this project builds and appears in no lockfile. The weekly run matters more for
# `images` than for the others, because the base images are pinned by tag and follow their
# upstream (decision F-5, residual risk R-10) — the scan is what turns that from a blind spot
# into a thing somebody is told about.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  # `workflow_dispatch` is not a convenience here, it is the only way to run the *wide* secret
  # scan on demand. `gitleaks-action` scans the commits of a push and the whole history on
  # every other event, so before this trigger existed the history scan ran once a week and
  # nowhere else — a fix for a history finding could not be verified until the following
  # Monday, and a regression could hide for six days.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks · no secret in history or diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, because the scan's scope depends on the event: the push's own
          # commits on a push, and every commit in the repository on a schedule or a dispatch.
          # A shallow clone would make the wide scan silently narrow.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Explicit, not left to auto-detection of a root `.gitleaks.toml`. A config that is
          # silently not loaded looks exactly like a config that is: the four allowed test
          # fakes come back as findings and the job goes red with no clue why.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  python-deps:
    name: pip-audit · backend lockfile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # No cache here. This job only exports the lockfile and runs pip-audit through
          # uvx. Sharing the ci backend job's cache key meant this faster job saved a cache
          # holding only pip-audit's dependencies, and the backend job could never save
          # its own ("Unable to reserve cache ... another job may be creating this cache").
          enable-cache: false
      - name: Export the locked runtime dependency set
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.lock.txt
      - name: pip-audit
        # Pinned: `uvx pip-audit` without a version installs whatever is newest at the
        # moment the job runs, so the tool auditing the supply chain was itself an
        # unpinned download. Dependabot's `github-actions` ecosystem does not see this —
        # it is a `run:` line, not a `uses:` — so it moves when somebody moves it.
        run: uvx pip-audit@2.10.1 --strict --requirement requirements.lock.txt

  node-deps:
    name: pnpm audit · frontend lockfile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: pnpm audit (production dependencies, high and above)
        run: pnpm audit --prod --audit-level=high

  images:
    name: trivy · what is inside the images
    runs-on: ubuntu-latest
    # `security-events: write` is what lets the last step publish a SARIF report. It is
    # scoped to this job rather than to the workflow, so the three lockfile audits keep the
    # read-only token they have always had.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # Compose interpolates the whole manifest, so it wants the variables even to build.
      - name: Generate a throwaway .env
        run: python3 infra/scripts/bootstrap_env.py

      # The images the stack actually runs, built the way the stack builds them. Scanning the
      # Dockerfiles instead would miss everything the base image brings, which is the half no
      # lockfile audit can reach.
      #
      # Two builds cover four services: api, worker and scheduler are the same context and the
      # same target, so they are one image under three names — `test_the_image_scan_covers_every_
      # image_the_stack_runs` asserts that rather than leaving it as a thing somebody noticed
      # once. db and redis are pulled, not built, which is exactly why they are scanned: nothing
      # in this repository decides what is inside them (R-10).
      - name: Build the runtime images
        run: |
          docker compose build api web
          docker pull postgres:16-alpine
          docker pull redis:7-alpine

      - name: Scan the project images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: aegisnet-api:latest
          severity: HIGH,CRITICAL
          # Unfixed findings are reported by the summary step below and do not fail the job.
          # A base image carrying a CVE with no upstream fix would otherwise turn every push
          # red until somebody with no fix available invented one, and a gate nobody can pass
          # is a gate people learn to switch off.
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan the dashboard image
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: aegisnet-web:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # These two report and do not gate, which is a decision rather than an oversight and is
      # written down in R-10. For an image this project builds, a finding is actionable — bump a
      # base tag, `apk upgrade`, or remove the package, all of which Chunk 30 did. For an image it
      # pulls, the only responses are to wait for the publisher to rebuild or to stop using
      # PostgreSQL, and neither is something a push should block on. The finding set is also large
      # and moves on somebody else's schedule: `postgres:16-alpine` carried twenty-seven HIGHs in
      # util-linux and the Go standard library on one architecture and a different set on another,
      # none of them reachable from anything in this repository. Gating on that would make CI a
      # coin flip on an upstream release, which is how a gate becomes something people switch off.
      # The scan still runs, still prints, and still runs weekly, so the findings are visible.
      - name: Scan the datastore images this project pulls rather than builds
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: postgres:16-alpine
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Scan redis
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: redis:7-alpine
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      # What lands in the Security tab, and why it is the opposite of what it was.
      #
      # These reports cover the images this project *builds*, and only those. That is the same
      # line the gate above draws, drawn for the same reason: a finding in `aegisnet-api` is
      # this repository's to fix, so it belongs somewhere that outlives a log's retention.
      #
      # It used to be the other way round — SARIF for the two pulled images, nothing for the
      # built ones — and that was wrong. It put **74 permanently open HIGH and CRITICAL alerts
      # on a public repository**, every one of them a Go standard-library CVE in the `gosu`
      # binary inside `postgres:16-alpine` (stdlib v1.24.6; fixed in Go 1.24.13, which nobody
      # here ships). They could not be closed, they came back on every push, and to a reader of
      # the Security tab they read as 74 vulnerabilities in AegisNet. That is the alert-shaped
      # version of the gate nobody can pass, and it fails the same way: the tab stops being
      # read. `ignore-unfixed: true` does not help — upstream Go *has* the fix; the image has
      # not been rebuilt with it.
      #
      # The pulled images did not stop being scanned. They are scanned in the two steps above,
      # printed in full, and re-run weekly, which is what R-10 promises and all it ever
      # promised. What changed is that a finding nobody here can act on no longer files a
      # ticket against this project.
      #
      # Trivy runs a second time per image rather than once with two outputs because the action
      # takes a single `format`. The vulnerability database is in the job's cache by now, so the
      # second pass costs seconds.
      #
      # `if: always()` throughout: when the gate above fails, its report is the thing you most
      # want, so it must not be skipped by the failure it describes.
      - name: Re-scan the API image into SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: aegisnet-api:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # `0`, because the step above already gated on this exact scan. Failing twice on one
          # finding would skip the upload and lose the report.
          exit-code: "0"
          format: sarif
          output: trivy-api.sarif

      - name: Re-scan the dashboard image into SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: aegisnet-web:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-web.sarif

      # A distinct `category` per image, or the second upload replaces the first and the
      # Security tab shows one image instead of two.
      - name: Publish the API report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Publish the dashboard report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web
