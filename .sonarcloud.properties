# SonarCloud automatic analysis (no scanner runs in CI; the GitHub App analyses each push).
# Tests are declared as tests so main-code ratings reflect main code; the lockfiles, the
# committed corpus and vendored directories are not source.
sonar.sources=backend/src,frontend/src,infra,tools,backend/Dockerfile,frontend/Dockerfile,docker-compose.yml,docker-compose.test.yml
sonar.tests=backend/tests
# Bisection round four, and the decisive one. Rounds 1-3 excluded `.github/**`, the only file
# with new executable code, and the two frontend files this push touched; the gate failed every
# time. Everything left that the push changed inside sonar.sources is a docstring. If excluding
# `backend/src/**` clears the gate, the finding is pre-existing code re-attributed to new code
# because its file changed — which would be worth knowing, and is not something a comment can
# cause. If it does not clear, the finding is not from this push at all.
# Restore this line once the answer is known.
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.ndjson,backend/src/**
sonar.python.version=3.12
