# Alembic configuration for the AegisNet backend.
#
# The migration environment lives inside the package (src/aegisnet/adapters/db/migrations)
# so that the runtime image, which ships only `src/`, can run `alembic upgrade head` under
# the migrator role (`make migrate`). See ADR-012.
#
# There is deliberately no `sqlalchemy.url` here: env.py builds the URL from the settings
# object, using the migrator credentials, so no credential can ever sit in this file.

[alembic]
script_location = %(here)s/src/aegisnet/adapters/db/migrations
prepend_sys_path = %(here)s/src
file_template = %%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40
revision_environment = false
