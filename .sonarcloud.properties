# SonarCloud automatic analysis (no scanner runs in CI; the GitHub App analyses each push).
# Tests are declared as tests so main-code ratings reflect main code; the lockfiles, the
# committed corpus and vendored directories are not source.
sonar.sources=backend/src,frontend/src,infra,tools,backend/Dockerfile,frontend/Dockerfile,docker-compose.yml,docker-compose.test.yml
sonar.tests=backend/tests
# Chunk 32 bisection: the Security Rating on New Code went to C on push fbb7b79, whose only
# files inside sonar.sources are the two Dockerfiles, the two compose manifests and one
# frontend test. Excluding the four infra files isolates which half carries the finding.
# Restore this line to its previous value once the answer is known.
# Round 2: the four infra files together carried it. Narrowing to the one line this push
# actually added that looks like a credential — `AEGISNET_LOAD_INGEST_TOKEN` in the test
# manifest. The identical `AEGISNET_E2E_ANALYST_PASSWORD` line beside it is older than the
# new-code window, which is why the same shape never showed before.
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.ndjson,docker-compose.test.yml
sonar.python.version=3.12
