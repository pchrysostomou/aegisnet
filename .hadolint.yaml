# hadolint configuration.
#
# Only three rules are waived, each with a reason rather than for convenience.
ignored:
  # DL3006 "always tag the version of an image explicitly".
  # False positive here: both Dockerfiles use `FROM ${IMAGE}` where IMAGE is an ARG whose
  # default is already pinned by minor tag (python:3.12-slim-bookworm, node:22-alpine,
  # ghcr.io/astral-sh/uv:python3.12-bookworm-slim). hadolint does not resolve ARG defaults,
  # so it reports the indirection rather than a missing tag. The ARG exists so CI can build
  # against a digest without editing the Dockerfile, which is how decision F-5 will land.
  - DL3006
  # DL3008 "pin versions in apt-get install".
  # The single apt package installed is procps, needed for the worker's pgrep liveness probe.
  # Pinning a Debian binary version inside a slim base breaks the build outright as soon as
  # Debian publishes a point release, which turns a hardening rule into recurring build
  # breakage. Base-image reproducibility is handled at the right layer instead: by digest
  # pinning the base image (F-5, `make pin-digests`), which fixes the apt snapshot too.
  - DL3008
  # DL3005 "do not use apt-get upgrade or dist-upgrade".
  # The rule protects build reproducibility: an upgrade makes the image depend on what Debian
  # published today rather than on what the base tag froze. This project has deliberately not
  # bought that property — the base is pinned by minor tag and not by digest (F-5, R-10) — so
  # the rule is defending something that was already traded away, and the cost of obeying it is
  # concrete. `libpcre2-8-0` shipped at `10.42-1` in every `aegisnet-api` container with five
  # advisories fixed in `10.42-1+deb12u1`, a patch already present in the suite the build reads
  # from. Without `upgrade`, that ships until somebody notices; with it, the next build fixes it
  # and the next scan closes the alert. If digest pinning ever lands (issue #14) this waiver
  # should be reconsidered in the same change, because then the rule would be defending
  # something real.
  - DL3005

failure-threshold: warning
